steps:
  # Instalar dependencias y correr lint + tests (frontend)
  - name: 'node:20-alpine'
    entrypoint: sh
    args:
      - '-c'
      - |
        corepack enable && corepack prepare pnpm@latest --activate
        pnpm install --frozen-lockfile
        pnpm --filter frontend typecheck
        pnpm --filter frontend lint
        pnpm --filter frontend test

  # Build frontend
  - name: 'node:20-alpine'
    entrypoint: sh
    args:
      - '-c'
      - |
        corepack enable && corepack prepare pnpm@latest --activate
        pnpm install --frozen-lockfile
        pnpm --filter frontend build

  # Build backend
  - name: 'node:20-alpine'
    entrypoint: sh
    args:
      - '-c'
      - |
        corepack enable && corepack prepare pnpm@latest --activate
        pnpm install --frozen-lockfile
        pnpm --filter backend build

  # Build y push imagen Docker del frontend
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/frontend:$COMMIT_SHA'
      - '-f'
      - 'frontend/Dockerfile'
      - '.'

  # Build y push imagen Docker del backend
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/backend:$COMMIT_SHA'
      - '-f'
      - 'backend/Dockerfile'
      - '.'

  # Push imágenes a Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/frontend'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/backend'

  # Desplegar frontend a Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      - 'run'
      - 'deploy'
      - 'frontend'
      - '--image=$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/frontend:$COMMIT_SHA'
      - '--region=$_DEPLOY_REGION'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--min-instances=0'
      - '--max-instances=3'

  # Desplegar backend a Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      - 'run'
      - 'deploy'
      - 'backend'
      - '--image=$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/backend:$COMMIT_SHA'
      - '--region=$_DEPLOY_REGION'
      - '--platform=managed'
      - '--min-instances=0'
      - '--max-instances=3'

# Variables sustituidas en Cloud Build
substitutions:
  _AR_REGION: us-central1
  _AR_REPO: taller01-artifacts
  _DEPLOY_REGION: us-central1

options:
  logging: CLOUD_LOGGING_ONLY
